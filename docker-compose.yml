services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app:cached
      - ./data:/data
    environment:
      # Correct the FLASK_APP path again
      FLASK_APP: main:create_app
      FLASK_ENV: development
      DATABASE_URL: sqlite:////data/app.db
      SECRET_KEY: "dev-secret-key"
      JWT_SECRET_KEY: "dev-jwt-secret-key"
    # Run migrations before starting the server
    command: sh -c "flask db upgrade && flask run --host=0.0.0.0 --port=5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host"

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    volumes:
      - ./backend:/app
    environment:
      PYTHONPATH: /app
      FLASK_ENV: testing
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "test-secret-key"
      JWT_SECRET_KEY: "test-jwt-secret-key"
      # Correct the FLASK_APP path
      FLASK_APP: backend.main:create_app
    command: pytest -v --cov=backend --cov-report=term-missing tests/

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    volumes:
      - ./frontend:/app:cached
      - frontend_test_node_modules:/app/node_modules
    # Use jest.config.js instead of jest.config.cjs
    command: npm run test -- --config jest.config.js

volumes:
  frontend_node_modules:
  frontend_test_node_modules:

networks:
  default:
    driver: bridge